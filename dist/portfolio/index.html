<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1f6" />
    <meta name="description" content="박주호의 웹·앱·프로그램 작업을 담은 개인 포트폴리오입니다." />
    <meta name="robots" content="noindex,nofollow" />
    <title>개인 포트폴리오 | 박주호</title>
    <link rel="preload" href="../fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="../styles/tokens.css?v=21" />
    <link rel="stylesheet" href="../styles/base.css?v=21" />
    <link rel="stylesheet" href="./portfolio.css?v=3" />
    <script src="./portfolio.js?v=3" type="module"></script>
  </head>
  <body>
    <!-- 문구 없이 아이콘만 보이되, 키보드와 보조기술에는 조작 목적을 전달한다. -->
    <nav class="room-controls" aria-label="포트폴리오 화면 조작">
      <a class="room-control back-button" href="../#projects" aria-label="프로젝트 기록으로 돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12"/></svg></a>
      <button class="room-control replay-button" type="button" aria-label="연출 다시 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></svg></button>
      <button class="room-control skip-button" type="button" aria-label="연출 건너뛰고 포트폴리오 보기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 10 7L5 19ZM19 5v14"/></svg></button>
    </nav>
    <main class="portfolio-workspace">
      <h1 class="sr-only">개인 포트폴리오</h1>
      <div class="portfolio-stage" aria-hidden="true"></div>
      <!-- 종이가 화면 앞으로 전개되면 큰 네 선택 면이 장면을 덮는다. -->
      <div class="presentation-backdrop" aria-hidden="true"></div>
      <div class="paper-links" role="group" aria-label="포트폴리오 1부터 4" hidden></div>
      <p class="scene-caption sr-only" aria-live="polite">포트폴리오 소개 연출을 재생합니다.</p>
      <noscript><p class="sr-only">포트폴리오 1부터 4는 준비 중입니다. 연출을 보려면 JavaScript를 켜 주세요.</p></noscript>
    </main>
  </body>
</html>
