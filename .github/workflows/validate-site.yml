name: Validate site

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: validate-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare production assets
        run: npm run build

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test
